name: luma_album
description: A cross-platform photo album manager built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Flutter 3.50 standalone UI packages
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

  # State management, hooks and routing
  hooks_riverpod: ^3.5.0
  flutter_hooks: ^0.21.4
  go_router: ^18.1.4

  # Photo, image and file capabilities
  photo_manager: ^3.12.0
  image_picker: ^1.2.4
  cached_network_image: ^4.0.7
  flutter_svg: ^2.4.0

  # Local storage and system information
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
