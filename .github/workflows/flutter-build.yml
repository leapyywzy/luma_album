name: Flutter CI and Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luma-album-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Show SDK versions
        run: |
          flutter --version
          dart --version

      - name: Generate native platform projects
        run: bash scripts/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      # 首次 CI 自动把官方生成的原生工程和 lockfile 纳入仓库。
      - name: Commit generated platform projects and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios windows .metadata pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate Flutter platform projects [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No generated files to commit."
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luma_album-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
